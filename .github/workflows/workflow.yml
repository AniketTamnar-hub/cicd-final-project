name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 nose

      - name: Lint with flake8
        run: |
          flake8 .

      - name: Fix nose compatibility
        run: |
          python -c "import pathlib, nose.suite; p=pathlib.Path(nose.suite.__file__); s=p.read_text(); s=s.replace('collections.Callable','collections.abc.Callable'); p.write_text(s)"

      - name: Run unit tests with nose
        run: |
          nosetests
